<!doctype html>
<meta charset="utf-8" />
<title>BharatBite — ONNX Runtime Web latency harness</title>
<!--
  Runtime-compatibility prototype: measures ONNX Runtime Web in the same browser
  engine the installed PWA/TWA uses (Chrome on Android), and emits a JSON record
  that `python3 -m bharatbite_ml.cli compat --browser <file>` consumes.

  This page is a measurement tool, not part of the app. It never publishes or
  signs anything, and it writes a record with `null`s wherever the browser will
  not tell us the truth (Firefox/Safari do not expose JS heap usage) so the
  Python validator rejects the record instead of guessing.

  Usage:
    1. Serve the page from any static origin (it needs network access to the
       runtime CDN and to the model URL).
    2. Enter the URL of the INT8 ONNX artifact and the exact SHA-256 that the
       signed manifest will carry.
    3. Run ≥100 warm inferences on the target phone (Chrome, devtools remote
       debugging), then "Download JSON" and feed it to the CLI.
-->
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 46rem; padding: 0 1rem; }
  label { display: block; margin: 0.75rem 0 0.25rem; font-weight: 600; }
  input { width: 100%; padding: 0.4rem; box-sizing: border-box; font: inherit; }
  button { margin-top: 1rem; padding: 0.5rem 1rem; font: inherit; cursor: pointer; }
  pre { background: #f4f4f5; padding: 1rem; overflow: auto; max-height: 24rem; }
  .warn { color: #9a3412; }
</style>
<h1>ONNX Runtime Web latency harness</h1>
<p>
  Runs a fixed-shape <code>1×3×224×224</code> float32 input through the model,
  warm, and reports init time, p50/p95 latency and peak JS heap.
</p>

<label for="modelUrl">Model URL (.onnx, INT8)</label>
<input id="modelUrl" placeholder="https://…/efficientnet_lite0_int8.onnx" />

<label for="expectedSha">Expected SHA-256 (from the manifest being measured)</label>
<input id="expectedSha" placeholder="64 hex characters" />

<label for="architecture">Architecture; must match the native side</label>
<input id="architecture" value="efficientnet_lite0_int8" />

<label for="glueLines">Glue code added for this runtime (lines, honest count)</label>
<input id="glueLines" type="number" value="0" min="0" />

<label for="iterations">Warm inferences (≥100)</label>
<input id="iterations" type="number" value="120" min="100" />

<button id="run">Load and measure</button>
<button id="download" disabled>Download JSON</button>
<pre id="out">Not run yet.</pre>

<script type="module">
const out = document.getElementById("out");
const downloadBtn = document.getElementById("download");
let record = null;

const ORT_VERSION = "1.20.1";
const ORT_URL = `https://cdn.jsdelivr.net/npm/onnxruntime-web@${ORT_VERSION}/dist/ort.min.js`;

function log(message) {
  out.textContent += (out.textContent.endsWith("\n") ? "" : "\n") + message;
}

function percentile(sorted, p) {
  if (sorted.length === 0) return null;
  const index = Math.min(sorted.length - 1, Math.max(0, Math.ceil((p / 100) * sorted.length) - 1));
  return sorted[index];
}

function toHex(buffer) {
  return [...new Uint8Array(buffer)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

function readHeapMb() {
  // Chrome-only; anything else returns NaN on purpose so the record is rejected.
  const memory = performance.memory;
  if (!memory || typeof memory.usedJSHeapSize !== "number") return null;
  return memory.usedJSHeapSize / (1024 * 1024);
}

async function loadOrt() {
  if (!window.ort) {
    await new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = ORT_URL;
      script.onload = resolve;
      script.onerror = () => reject(new Error("could not load onnxruntime-web from the CDN"));
      document.head.appendChild(script);
    });
  }
  window.ort.env.wasm.numThreads = navigator.hardwareConcurrency || 1;
  window.ort.env.wasm.simd = true;
  return window.ort;
}

async function measure() {
  out.textContent = "";
  downloadBtn.disabled = true;
  const modelUrl = document.getElementById("modelUrl").value.trim();
  const expectedSha = document.getElementById("expectedSha").value.trim().toLowerCase();
  const architecture = document.getElementById("architecture").value.trim();
  const iterations = Math.max(100, Number(document.getElementById("iterations").value) || 120);
  const glueLines = Math.max(0, Number(document.getElementById("glueLines").value) || 0);

  if (!modelUrl) throw new Error("model URL is required");

  log("Downloading the artifact…");
  const response = await fetch(modelUrl);
  if (!response.ok) throw new Error(`download failed: HTTP ${response.status}`);
  const bytes = await response.arrayBuffer();
  const sha = toHex(await crypto.subtle.digest("SHA-256", bytes));
  log(`artifact ${(bytes.byteLength / 1e6).toFixed(2)} MB, sha256 ${sha}`);
  if (expectedSha && expectedSha !== sha) {
    throw new Error("SHA-256 does not match the manifest — wrong artifact, refusing to measure");
  }

  const ort = await loadOrt();
  const threads = ort.env.wasm.numThreads;

  log("Creating the inference session (init time)…");
  const initStart = performance.now();
  const session = await ort.InferenceSession.create(bytes, { executionProviders: ["wasm"], graphOptimizationLevel: "all" });
  const initMs = performance.now() - initStart;

  const size = 224;
  const data = new Float32Array(3 * size * size);
  for (let i = 0; i < data.length; i += 1) data[i] = ((i % 255) / 255) * 2 - 1;
  const inputName = session.inputNames[0];
  const feeds = { [inputName]: new ort.Tensor("float32", data, [1, 3, size, size]) };

  log("Warming up (10 runs)…");
  for (let i = 0; i < 10; i += 1) await session.run(feeds);

  log(`Measuring ${iterations} warm runs…`);
  const timings = [];
  let peakHeap = readHeapMb() ?? 0;
  for (let i = 0; i < iterations; i += 1) {
    const start = performance.now();
    await session.run(feeds);
    timings.push(performance.now() - start);
    const heap = readHeapMb();
    if (heap !== null) peakHeap = Math.max(peakHeap, heap);
  }
  timings.sort((a, b) => a - b);

  const heapAvailable = readHeapMb() !== null;
  if (!heapAvailable) log("WARNING: this browser hides JS heap usage — the record will be rejected.");

  record = {
    schemaVersion: 1,
    runtime: "onnxruntime-web",
    runtimeVersion: ORT_VERSION,
    model: { architecture, format: "onnx", sizeBytes: bytes.byteLength, sha256: sha },
    measuredOn: {
      device: navigator.userAgent,
      os: navigator.platform || "unknown",
      engine: "wasm",
      threads,
    },
    measuredAt: new Date().toISOString(),
    initMs: Number(initMs.toFixed(2)),
    latencyP50Ms: Number(percentile(timings, 50).toFixed(2)),
    latencyP95Ms: Number(percentile(timings, 95).toFixed(2)),
    peakMemoryMb: heapAvailable ? Number(peakHeap.toFixed(1)) : null,
    warmRuns: timings.length,
    integration: {
      glueLines,
      newDependencies: 1, // onnxruntime-web
      extraBuildSteps: 0,
      nativeToolchain: false,
      reusesManifestVerifier: true, // WebCrypto verifies the manifest signature already
    },
  };

  out.textContent += "\n" + JSON.stringify(record, null, 2);
  downloadBtn.disabled = false;
}

document.getElementById("run").addEventListener("click", () => {
  measure().catch((error) => log(`FAILED: ${error.message}`));
});

downloadBtn.addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(record, null, 2)], { type: "application/json" });
  const anchor = document.createElement("a");
  anchor.href = URL.createObjectURL(blob);
  anchor.download = `ort-web-${Date.now()}.json`;
  anchor.click();
});
</script>
