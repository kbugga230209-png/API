<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Beyond the Realm</title>
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0f'/%3E%3Ccircle cx='32' cy='30' r='16' fill='none' stroke='%23d4af37' stroke-width='4'/%3E%3Ccircle cx='32' cy='30' r='7' fill='%23d4af37'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
background:radial-gradient(800px 500px at 50% 30%,rgba(212,175,55,.08),transparent 65%),#0a0a0f;

</head>
<body>
<main>
<h1>404</h1>
<p>You&rsquo;ve wandered beyond the render distance.<br>This chunk was never generated.</p>
<a id="home" href="./">Return to the Universe</a>
</main>
<script>
(function(){
  var p=location.pathname,i=p.indexOf("/API/");
  document.getElementById("home").href=i>-1?p.slice(0,i+5):"/";
})();
</script>
</body>
