# Android distribution.
#
# `verify` proves the committed build config compiles and that the produced APK
# passes signature verification — no signing secret is involved, so it can run on
# every push that touches android/.
#
# `release` is manual only and needs four repository secrets plus one for the
# keystore. They are decoded into a temporary file, never echoed, and deleted
# when the job ends. If any secret is missing the job fails before it can produce
# an unsigned APK that looks shippable.
name: android release

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName for the release APK (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
      version_code:
        description: 'Monotonically increasing versionCode'
        required: true
        default: '1'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: build config + APK integrity (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Use the runner's preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK" || { echo "::error::no Android SDK on this runner ($SDK)"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Assemble debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # GitHub's log download is not reachable from every environment, so the
      # actionable lines are also published as annotations on the check run.
      - name: Publish build errors as annotations
        if: failure()
        run: |
          LOG=android/build.log
          [ -f "$LOG" ] || { echo "::error title=gradle::no build log was produced"; exit 0; }
          grep -nE "^(FAILURE|\* What went wrong|\* Try|e: |> Task .* FAILED|Caused by)" -A3 "$LOG" | head -60 | sed 's/%/%25/g;s/\r//g' | while IFS= read -r line; do
            echo "::error title=gradle::${line:0:900}"
          done
          grep -E "error:|Unresolved reference|Could not (find|resolve|determine)|requires|compileSdk|minCompileSdk|Dependency '" "$LOG" | head -25 | sed 's/%/%25/g;s/\r//g' | while IFS= read -r line; do
            echo "::error title=gradle-detail::${line:0:900}"
          done

      - name: Verify the APK is signed and intact
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-verify.txt
          if ! grep -q "Verifies" apk-verify.txt; then
            echo "::error::apksigner did not confirm the APK signature"
            exit 1
          fi
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Confirm zipalign and manifest basics
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -v 4 "$APK" | tail -3
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|launchable-activity:" | tee badging.txt

      - name: Refuse to build an unsigned release
        working-directory: android
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon > release-attempt.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::a release APK was built without signing material — the guard is broken"
            find app/build/outputs/apk/release -name '*.apk' | sed 's/^/unsigned: /'
            exit 1
          fi
          grep -q "Refusing to build an unsigned release" release-attempt.log
          echo "release build correctly refused without a keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: bharatbite-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            apk-verify.txt
            apk-sha256.txt
            badging.txt
          retention-days: 14

  release:
    name: signed release APK (secrets required)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::missing secret $name (see docs/ANDROID.md)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "No APK was produced. An unsigned release is never distributed."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Use the runner's preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK" || { echo "::error::no Android SDK on this runner ($SDK)"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Decode keystore into the runner's temp dir
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" | grep -E "Alias name|Entry type|Valid from" || true
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon \
            -PversionName="${{ inputs.version_name }}" \
            -PversionCode="${{ inputs.version_code }}"

      - name: Verify signature, print certificate and APK digests
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee release-verify.txt
          grep -q "Verifies" release-verify.txt
          grep -q "Number of signers: 1" release-verify.txt
          sha256sum "$APK" | tee release-sha256.txt
          # Certificate digest is published so users can pin it.
          openssl dgst -sha256 -binary <(keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}") \
            | openssl base64 | sed 's/^/certificate-sha256-base64: /' | tee release-cert.txt

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
          echo "keystore removed from runner"

      - uses: actions/upload-artifact@v4
        with:
          name: bharatbite-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            release-verify.txt
            release-sha256.txt
            release-cert.txt
          retention-days: 90
          if-no-files-found: error
