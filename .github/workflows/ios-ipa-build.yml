name: Build INKVAULT iPadOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  checks: write

jobs:
  build-ipados-ipa:
    name: macOS Xcode 16 Build & IPA Export
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install exact dependencies via lockfile
        run: npm ci

      - name: Run TypeScript typecheck & Vitest suite
        run: |
          npm run typecheck
          npm test

      - name: Build production web assets & iOS WebBundle
        run: |
          npm run build:ios
          ls -la ios/InkVaultApp/WebBundle
          ls -la ios/InkVaultApp/Resources/Assets.xcassets/AppIcon.appiconset

      - name: Install XcodeGen & generate InkVault.xcodeproj
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd ios
          xcodegen generate | tee build-xcodegen.txt
          mv build-xcodegen.txt ..
          xcodebuild -version | tee ../xcode-version.txt
          xcodebuild -list -project InkVault.xcodeproj

      - name: Verify Simulator Debug build (x86_64/arm64 iPadOS Simulator SDK)
        run: |
          mkdir -p ios/build
          set -o pipefail
          xcodebuild build \
            -project ios/InkVault.xcodeproj \
            -scheme InkVault \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | tee ios/build/xcodebuild-simulator.log

      - name: Archive Release ARM64 iPadOS application
        run: |
          mkdir -p ios/build
          set -o pipefail
          xcodebuild archive \
            -project ios/InkVault.xcodeproj \
            -scheme InkVault \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ios/build/InkVault.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER=app.inkvault.studio \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | tee ios/build/xcodebuild-archive.log

      - name: Package & inspect INKVAULT.ipa
        run: |
          chmod +x scripts/package-unsigned-ipa.sh
          ./scripts/package-unsigned-ipa.sh "ios/build/InkVault.xcarchive" "ios/build/ipa" "INKVAULT.ipa"
          plutil -p ios/build/InkVault.xcarchive/Products/Applications/InkVault.app/Info.plist > ios/build/compiled-info-plist.txt
          shasum -a 256 ios/build/ipa/INKVAULT.ipa | tee ios/build/ipa/INKVAULT.ipa.sha256

      - name: Upload INKVAULT.ipa & Xcode build logs
        uses: actions/upload-artifact@v4
        with:
          name: INKVAULT-iPadOS-IPA-and-Logs
          path: |
            ios/build/ipa/INKVAULT.ipa
            ios/build/ipa/INKVAULT.ipa.sha256
            ios/build/xcodebuild-simulator.log
            ios/build/xcodebuild-archive.log
            ios/build/compiled-info-plist.txt
          retention-days: 30

      - name: Publish API-retrievable IPA blob & build verification summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]

          def create_blob(file_path):
              with open(file_path, "rb") as f:
                  b64 = base64.b64encode(f.read()).decode("ascii")
              payload = json.dumps({"content": b64, "encoding": "base64"})
              res = subprocess.run(
                  ["gh", "api", f"repos/{repo}/git/blobs", "--method", "POST", "--input", "-"],
                  input=payload,
                  text=True,
                  capture_output=True,
                  check=True,
              )
              return json.loads(res.stdout)["sha"]

          ipa_blob = create_blob("ios/build/ipa/INKVAULT.ipa")

          sim_log = open("ios/build/xcodebuild-simulator.log", errors="replace").read()
          arc_log = open("ios/build/xcodebuild-archive.log", errors="replace").read()
          sim_warnings = [l for l in sim_log.splitlines() if "warning:" in l.lower()]
          arc_warnings = [l for l in arc_log.splitlines() if "warning:" in l.lower()]

          report = {
              "xcode_version": open("xcode-version.txt").read().strip(),
              "xcodegen_output": open("build-xcodegen.txt").read().strip(),
              "simulator_tail": "\n".join(sim_log.splitlines()[-25:]),
              "archive_tail": "\n".join(arc_log.splitlines()[-25:]),
              "simulator_warnings": sim_warnings[:30],
              "archive_warnings": arc_warnings[:30],
              "ipa_sha256": open("ios/build/ipa/INKVAULT.ipa.sha256").read().strip(),
              "ipa_size_bytes": os.path.getsize("ios/build/ipa/INKVAULT.ipa"),
              "ipa_blob_sha": ipa_blob,
              "compiled_plist": open("ios/build/compiled-info-plist.txt").read(),
          }
          with open("ios/build/verification-report.json", "w") as out:
              json.dump(report, out, indent=2)

          report_blob = create_blob("ios/build/verification-report.json")

          checks = json.loads(
              subprocess.check_output(["gh", "api", f"repos/{repo}/commits/{sha}/check-runs"], text=True)
          )["check_runs"]
          for c in checks:
              if "Xcode 16" in c["name"]:
                  patch_payload = json.dumps({
                      "output": {
                          "title": "INKVAULT.ipa Compiled & Verified",
                          "summary": json.dumps({
                              "ipa_blob_sha": ipa_blob,
                              "report_blob_sha": report_blob,
                              "ipa_sha256": report["ipa_sha256"],
                              "ipa_size_bytes": report["ipa_size_bytes"],
                              "simulator_warning_count": len(sim_warnings),
                              "archive_warning_count": len(arc_warnings),
                          })
                      }
                  })
                  subprocess.run(
                      ["gh", "api", f"repos/{repo}/check-runs/{c['id']}", "--method", "PATCH", "--input", "-"],
                      input=patch_payload,
                      text=True,
                      check=True,
                  )
          PY
