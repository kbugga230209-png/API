name: InkVault
options:
  bundleIdPrefix: app.inkvault
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: InkVault
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: NO

targets:
  InkVault:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: InkVaultApp/Sources
      - path: InkVaultApp/Resources
      - path: InkVaultApp/WebBundle
        type: folder
        buildPhase: resources
      - path: InkVaultApp/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: InkVaultApp/Info.plist
    entitlements:
      path: InkVaultApp/InkVault.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.inkvault.studio
        INFOPLIST_FILE: InkVaultApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: InkVaultApp/InkVault.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: INKVAULT
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - sdk: WebKit.framework
      - sdk: PencilKit.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: Security.framework
      - sdk: CryptoKit.framework
      - sdk: Vision.framework
